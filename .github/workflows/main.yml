name: House Price Prediction CI

# This triggers the workflow every time you push code to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the repository code
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Set up Python environment
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10' # You can change this to your Python version

    # 3. Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # If you have a requirements.txt file, this will install your packages (pandas, scikit-learn, etc.)
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. Run your Python script
    # Replace 'main.py' with the actual name of your script (e.g., app.py, train.py, model.py)
    - name: Run prediction model
      run: |
        python train.py
